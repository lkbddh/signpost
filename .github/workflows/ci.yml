name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: "1.93"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y just pkg-config libxkbcommon-dev libwayland-dev desktop-file-utils appstream dbus dpkg-dev
      - uses: dtolnay/rust-toolchain@1.93
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: rustc --version
      - run: just validate
