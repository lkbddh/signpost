# Standalone manifest resolved from Cargo.toml.orig and the pinned iced workspace.
["package"]
"name" = "iced_winit"
"description" = "A runtime for iced on top of winit"
"version" = "0.14.0"
"edition" = "2024"
"authors" = ["Héctor Ramón Jiménez <hector@hecrj.dev>"]
"license" = "MIT"
"repository" = "https://github.com/iced-rs/iced"
"homepage" = "https://iced.rs"
"categories" = ["gui"]
"keywords" = ["gui", "ui", "graphics", "interface", "widgets"]

["package"."metadata"]

["package"."metadata"."signpost"]
"upstream" = "https://github.com/pop-os/libcosmic.git"
"revision" = "87ab8179e1bd9880239c340855ae8862034bd0e8"
"subdirectory" = "iced/winit"
"iced-upstream" = "https://github.com/pop-os/iced.git"
"iced-revision" = "5fc4372d877ad2ca6eaab1c0ca5e424f238b9258"
"local-fix" = "Retire completed runtime futures before processing later or reentrant native events."

["lints"]

["lints"."rust"]
"unused_results" = "deny"
# Upstream's own warnings, which cargo hides for the crates it downloads and would show here, in the tree.
"warnings" = "allow"

["lints"."rust"."rust_2018_idioms"]
"level" = "deny"
"priority" = -1

["lints"."clippy"]
"type-complexity" = "allow"
"map-entry" = "allow"
"large-enum-variant" = "allow"
"result_large_err" = "allow"
"semicolon_if_nothing_returned" = "deny"
"trivially-copy-pass-by-ref" = "deny"
"default_trait_access" = "deny"
"match-wildcard-for-single-variants" = "deny"
"redundant-closure-for-method-calls" = "deny"
"filter_map_next" = "deny"
"manual_let_else" = "deny"
"unused_async" = "deny"
"from_over_into" = "deny"
"needless_borrow" = "deny"
"new_without_default" = "deny"
"useless_conversion" = "deny"

["lints"."rustdoc"]
"broken_intra_doc_links" = "forbid"

["features"]
"wayland" = ["winit/wayland", "wayland-csd-adwaita", "wayland-protocols", "raw-window-handle", "iced_runtime/wayland", "wayland-backend", "xkbcommon", "xkbcommon-dl", "xkeysym", "dep:cctk"]
"default" = ["x11", "wayland-dlopen"]
"debug" = ["iced_debug/enable"]
"sysinfo" = ["dep:sysinfo"]
"unconditional-rendering" = []
"linux-theme-detection" = ["dep:mundy", "mundy/async-io", "mundy/color-scheme"]
"x11" = ["winit/x11"]
"system" = ["sysinfo"]
"program" = []
"wayland-dlopen" = ["winit/wayland-dlopen"]
"wayland-csd-adwaita" = ["winit/wayland-csd-adwaita"]
"a11y" = ["iced_accessibility", "iced_runtime/a11y"]
"single-instance" = []

